name: Lab 5 Manual workflow

on:
  workflow_dispatch:
    inputs:
      student_name:
        description: "Ім'я для привітання або Executer для пропуску"
        required: true
        default: "Executer"
        type: string

permissions:
  contents: read

jobs:
  greeting:
    name: Greeting and conditions
    runs-on: ubuntu-latest

    steps:
      - name: Show launch information
        env:
          STUDENT_NAME: ${{ inputs.student_name }}
        run: |
          printf 'Workflow started manually\n'
          printf 'Parameter: %s\n' "$STUDENT_NAME"

      - name: Send greeting
        if: inputs.student_name != 'Executer'
        env:
          STUDENT_NAME: ${{ inputs.student_name }}
        run: printf 'Hello, %s!\n' "$STUDENT_NAME"

      - name: Explain skipped greeting
        if: inputs.student_name == 'Executer'
        run: echo "Greeting skipped because the parameter is Executer"

  tests:
    name: Run integration tests
    needs: greeting
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install flask pytest

      - name: Run tests
        working-directory: lab_testing/lab4
        run: python -m pytest test_app.py -v
