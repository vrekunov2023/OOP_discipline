name: Lab 3 Coverage

on:
  push:
    paths:
      - "lab_testing/lab3/**"
      - ".github/workflows/coverage.yml"
  pull_request:
    paths:
      - "lab_testing/lab3/**"
      - ".github/workflows/coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lab_testing/lab3

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install coverage pytest pytest-cov

      - name: Run unittest
        run: python -m unittest discover -p "test_unittest.py" -v

      - name: Test coverage with a 90 percent threshold
        run: >
          python -m pytest test_app.py
          --cov=app
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=90
          -v

      - name: Save XML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab3-coverage
          path: lab_testing/lab3/coverage.xml
          if-no-files-found: warn