name: Lab 5 Python application

on:
  push:
    branches: ["main"]
    paths:
      - "lab_testing/lab4/**"
      - ".github/workflows/python-app.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "lab_testing/lab4/**"
      - ".github/workflows/python-app.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Run Python and integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install flask pytest

      - name: Check Python syntax
        run: >
          python -m py_compile
          lab_testing/lab4/app.py
          lab_testing/lab4/test_app.py

      - name: Run Python from previous laboratory
        working-directory: lab_testing/lab4
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from app import create_app

          with TemporaryDirectory() as folder:
              app = create_app(
                  Path(folder) / "tasks.db",
                  Path(folder) / "tasks.json",
              )

              with app.test_client() as client:
                  response = client.get("/tasks")
                  assert response.status_code == 200
                  assert response.get_json() == []
                  print("HTTP status:", response.status_code)
                  print("Tasks:", response.get_json())
          PY

      - name: Run integration tests
        working-directory: lab_testing/lab4
        run: python -m pytest test_app.py -v
